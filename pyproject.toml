[project]
name = "tennis-data"
version = "0.1.0"
description = "Intelligence-first sports data platform (tennis first): ingestion, normalized model, read API."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    # zoneinfo a besoin d'une base IANA: absente sous Windows, et pas garantie sur une image minimale
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",  # client HTTP de TestClient (starlette >= 1.8)
    "pytest>=8.3",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_data"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "UP017",  # on garde timezone.utc, idiome deja utilise partout
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declare ses dependances et parametres via des appels en valeur par defaut
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["tennis_data"]

[tool.ruff.lint.per-file-ignores]
# migrations generees par Alembic: on garde le format genere
"migrations/versions/*" = ["UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs a Postgres database (TEST_DATABASE_URL); skipped otherwise",
]
